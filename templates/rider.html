<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ပို့ဆောင်သူ - တည်နေရာတင်ခြင်း</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Noto Sans Myanmar", "Myanmar Text", "Microsoft YaHei", Arial, sans-serif;
    background:#f5f5f5; padding: 16px;
  }
  .top {
    background: linear-gradient(135deg, #f6d365, #fda085);
    margin: -16px -16px 20px;
    padding: 20px 16px 34px;
    color:#fff;
  }
  .top h2 { font-size:22px; color:#fff; margin-bottom:4px; }
  .top .sub { font-size:13px; opacity:.9; margin-top:4px; line-height:1.8; color:#fff; }
  h2 { text-align:center; color:#333; margin-bottom: 4px; }
  .sub { text-align:center; color:#999; font-size:13px; margin-bottom: 16px; }
  .panel { background:#fff; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  label { display:block; font-size:13px; color:#666; margin: 10px 0 4px; }
  input {
    width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;
    font-size:15px; outline:none;
  }
  input:focus { border-color:#fda085; }
  .btn {
    display:block; width:100%; padding:12px; border:none; border-radius:10px;
    font-size:16px; cursor:pointer; margin-top:14px; color:#fff;
    background: linear-gradient(135deg, #f6d365, #fda085);
  }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .btn-gray { background:#999; }
  .btn-green { background: linear-gradient(135deg, #56ab2f, #a8e063); color:#fff; }
  .row2 { display:flex; gap:10px; }
  .row2 .btn { flex:1; }
  .info { font-size:13px; color:#333; line-height:2; margin-top:10px; }
  .info b { color:#e07b00; }
  .status-box { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .status-box button {
    flex:1; min-width:90px; padding:10px; border-radius:8px; border:2px solid #eee;
    background:#fafafa; font-size:14px; cursor:pointer;
  }
  .status-box button.active { border-color:#fda085; background:#fff3e9; color:#e07b00; font-weight:bold; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#fda085; margin-right:6px; }
  .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:99; }
  .modal-box { background:#fff; border-radius:12px; padding:20px; width:90%; max-width:360px; position:relative; box-shadow:0 4px 20px rgba(0,0,0,0.25); }
  .modal-close { position:absolute; top:6px; right:10px; background:none; border:none; font-size:24px; line-height:1; cursor:pointer; color:#888; }
  .modal-box h3 { margin:0 0 6px; color:#333; font-size:17px; }
  .modal-info { text-align:center; padding:28px 22px 22px; }
  .info-icon {
    width:58px; height:58px; margin:0 auto 12px; border-radius:50%;
    background:linear-gradient(135deg, #56ab2f, #a8e063); color:#fff;
    font-size:30px; line-height:58px; font-weight:bold;
    box-shadow:0 4px 12px rgba(86,171,47,0.4);
  }
  .info-text { font-size:15px; color:#555; line-height:1.8; margin:4px 0 18px; word-break:break-word; }
  .btn-ok { background:linear-gradient(135deg, #56ab2f, #a8e063); margin-top:0; }
  .modal-confirm { text-align:center; }
  .confirm-icon {
    width:58px; height:58px; margin:0 auto 12px; border-radius:50%;
    background:linear-gradient(135deg, #56ab2f, #a8e063); color:#fff;
    font-size:30px; line-height:58px; font-weight:bold;
    box-shadow:0 4px 12px rgba(86,171,47,0.4);
  }
  .history-item {
    background:#f9f9f9; border:1px solid #eee; border-radius:10px;
    padding:12px; margin:10px 0; text-align:left; font-size:13px; line-height:2; color:#333;
  }
  .history-item b { color:#e07b00; }
  .history-empty { text-align:center; color:#999; padding:24px 0; font-size:14px; }
  .history-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .history-head h3 { margin:0; }
  .history-head select { padding:6px 8px; border:1px solid #ddd; border-radius:8px; font-size:13px; background:#fff; color:#333; max-width:180px; }
  .history-more { text-align:center; margin-top:10px; }
  .history-more .btn { margin-top:0; padding:8px; font-size:13px; }
  .status-box button:disabled { background:#eee; color:#bbb; cursor:not-allowed; border-color:#eee; }
  #confirmDeliveredBtn:disabled { background:#ccc; cursor:not-allowed; }
</style>
</head>
<body>
  <div class="top">
    <h2>🛵 7Star Delivery</h2>
    <div class="sub">Orderချိတ်ဆက်ပြီးပါက သင့်တည်နေရာကို အလိုအလျောက် တင်ပေးမည်</div>
  </div>

  <div class="panel">
    <button class="btn" onclick="createOrder()">Get New Orders</button>
    <div class="info" id="orderBox" style="display:none">Order Number：<b id="newOrder"></b></div>
  </div>

  <div class="panel">
    <label>ပို့ဆောင်သူ အမည်</label>
    <input id="riderName" placeholder="ဥပမာ - မောင်မောင်" value="မောင်မောင်">
    <label>ပို့ဆောင်သူ ဖုန်းနံပါတ်</label>
    <input id="riderPhone" placeholder="ဖုန်းနံပါတ် ထည့်ပါ" type="tel">
    <label>ပေါက်စီအရေအတွက်</label>
    <input id="baoziCount" placeholder="ပေါက်စီ အရေအတွက် ထည့်ပါ" type="number" min="0">
    <label>ဆိုင်အရေအတွက်</label>
    <input id="shopCount" placeholder="ဆိုင် အရေအတွက် ထည့်ပါ" type="number" min="0">
    <label>ပို့ရမည့်ဆိုင်လိပ်စာ：</label>
    <input id="deliveryAddress" placeholder="ပို့ရမည့် ဆိုင်လိပ်စာ ထည့်ပါ">
    <label>Order Number</label>
    <input id="orderNo" placeholder="ဥပမာ - BZ1001102030">
    <div class="row2">
      <button class="btn" id="bindBtn" onclick="bindOrder()">အမှာစာ ချိတ်ဆက်၍ ပို့ဆောင်စမည်</button>
      <button class="btn btn-gray" id="historyBtn" onclick="openHistory()">Order History</button>
    </div>
  </div>

  <div class="panel" id="reportPanel" style="display:none">
    <div class="info">
      <span class="dot"></span>Date：<b id="curDate">-</b><br>
      <span class="dot"></span>လက်ရှိOrder Number：<b id="curOrder"></b><br>
      <span class="dot"></span>လက်ရှိအခြေအနေ：<b id="curStatus">-</b><br>
      <span class="dot"></span>လက်ရှိနေရာ:<span id="curLocation">-</span><br>
      <span class="dot"></span>ကျန်ရှိသောပေါက်စီအလုံးအရေတွက်：<span id="curBaozi">-</span><br>
      <span class="dot"></span>ကျန်ရှိသောဆိုင်အရေတွက်：<span id="curShop">-</span><br>
      <span class="dot"></span>နောက်ဆုံး တင်ပြချိန်：<span id="lastTime">-</span>
    </div>
    <div class="status-box" id="statusBox">
      <button data-status="အစားအစာယူရန် စောင့်ဆိုင်း" onclick="requestStatus('အစားအစာယူရန် စောင့်ဆိုင်း')">အစားအစာယူရန် စောင့်ဆိုင်း</button>
      <button data-status="ပို့ဆောင်နေသည်" onclick="requestStatus('ပို့ဆောင်နေသည်')">ပို့ဆောင်နေသည်</button>
      <button data-status="ရောက်ရှိပြီး" onclick="requestStatus('ရောက်ရှိပြီး')">ရောက်ရှိပြီး</button>
    </div>
    <button class="btn btn-green" id="confirmDeliveredBtn" onclick="confirmDelivered()">လက်ခံပြီးပါပြီ</button>
    <div class="row2">
      <button class="btn" id="gpsBtn" onclick="startGps()" disabled>GPS ဖွင့်ထားသည်</button>
    </div>
  </div>

  <div class="modal-overlay" id="stateConfirmModal" style="display:none">
    <div class="modal-box modal-confirm">
      <button class="modal-close" onclick="closeStateConfirm()">×</button>
      <div class="confirm-icon">?</div>
      <h3>Confirm Status</h3>
      <p class="info-text" id="stateConfirmText"></p>
      <div class="row2">
        <button class="btn btn-green" onclick="doConfirmState()">Confirm ✅</button>
        <button class="btn btn-gray" onclick="closeStateConfirm()">Cancel ❌</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal" style="display:none">
    <div class="modal-box modal-confirm">
      <button class="modal-close" onclick="closeConfirmModal()">×</button>
      <div class="confirm-icon">✓</div>
      <h3>လက်ခံပြီးပါပြီ</h3>
      <label>လက်ခံရရှိပေါက်စီအလုံးအရေတွက်</label>
      <input id="confirmBaozi" type="number" min="0" placeholder="အရေအတွက် ထည့်ပါ">
      <label>လက်ခံရရှိဆိုင်လိပ်စာ</label>
      <input id="confirmAddress" placeholder="ဆိုင်လိပ်စာ ထည့်ပါ">
      <div class="row2">
        <button class="btn btn-green" onclick="doConfirmDelivered()">Confirm ✅</button>
        <button class="btn btn-gray" onclick="closeConfirmModal()">Cancel ❌</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="historyModal" style="display:none">
    <div class="modal-box modal-info" style="max-width:480px; max-height:82vh; overflow-y:auto;">
      <button class="modal-close" onclick="closeHistory()">×</button>
      <div class="history-head">
        <h3>Order History</h3>
        <select id="historyDateFilter" onchange="renderHistory()"></select>
      </div>
      <div id="historyList"></div>
      <div class="history-more" id="historyMoreWrap" style="display:none;">
        <button class="btn" id="historyMoreBtn" onclick="toggleHistoryMore()">View More</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="infoModal" style="display:none">
    <div class="modal-box modal-info">
      <button class="modal-close" onclick="closeInfoModal()">×</button>
      <div class="info-icon" id="infoIcon">✓</div>
      <h3 id="infoTitle">အသိပေးချက်</h3>
      <p class="info-text" id="infoText"></p>
      <button class="btn btn-ok" onclick="closeInfoModal()">အိုကေ</button>
    </div>
  </div>

<script>
var state = {
  orderNo: "", phone: "", name: "", status: "",
  statusLocked: false, pendingStatus: "",
  confirmedStatuses: [],
  gpsTimer: null, simTimer: null, refreshTimer: null, gpsWatchId: null,
  curLat: null, curLng: null, gpsEnabled: true
};

// ---------- ဆိုင်က အမှာစာ ဖန်တီးခြင်း ----------
async function createOrder() {
  try {
    var r = await fetch("/api/order/create", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ customer_name: "ဖောက်သည်", address: "ဥပမာလိပ်စာ ၈၈" })
    });
    var j = await r.json();
    if (j.ok) {
      document.getElementById("newOrder").textContent = j.order_no;
      document.getElementById("orderBox").style.display = "block";
      document.getElementById("orderNo").value = j.order_no;
    } else {
      showInfo(j.msg || "ဖန်တီးမှု မအောင်မြင်ပါ");
    }
  } catch (e) {
    showInfo("ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။ ဝန်ဆောင်မှု စတင်ထားခြင်း ရှိမရှိ စစ်ဆေးပါ（请检查后端服务是否已启动，并用 http:// 地址访问）");
  }
}

// ---------- အမှာစာ ချိတ်ဆက်ခြင်း ----------
async function bindOrder() {
  var phone = document.getElementById("riderPhone").value.trim();
  var orderNo = document.getElementById("orderNo").value.trim();
  var name = document.getElementById("riderName").value.trim();
  if (!phone || !orderNo) { showInfo("ဖုန်းနံပါတ်နှင့် အမှာစာနံပါတ် နှစ်ခုလုံး ထည့်သွင်းပါ"); return; }

  try {
    var baoziTotal = document.getElementById("baoziCount").value.trim();
    var shopTotal = document.getElementById("shopCount").value.trim();
    var deliveryAddress = document.getElementById("deliveryAddress").value.trim();
    var r = await fetch("/api/rider/bind", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        name: name, phone: phone, order_no: orderNo,
        rider_name: name, baozi_total: baoziTotal || 0,
        shop_total: shopTotal || 0, delivery_address: deliveryAddress
      })
    });
    var j = await r.json();
    if (!j.ok) { showInfo(j.msg); return; }

    state.orderNo = orderNo;
    state.phone = phone;
    state.name = name;
    // 新订单绑定：重置状态锁定，保证上一单完成后可重新ချိတ်ဆက်
    state.statusLocked = false;
    state.pendingStatus = "";
    state.confirmedStatuses = [];
    document.querySelectorAll("#statusBox button").forEach(function(btn) { btn.disabled = false; });
    document.getElementById("confirmDeliveredBtn").disabled = false;
    document.getElementById("reportPanel").style.display = "block";
    document.getElementById("curOrder").textContent = orderNo;
    document.getElementById("curDate").textContent = formatEnglishDate(new Date());
    document.getElementById("bindBtn").disabled = true;
    document.getElementById("bindBtn").textContent = "ချိတ်ဆက်ပြီးပါပြီ";
    showInfo("ချိတ်ဆက်မှု အောင်မြင်ပါသည်။ GPS ဖွင့်ပြီး တည်နေရာ တင်နေပါသည်");
    // GPS 强制开启：绑定成功后自动开启，快递员端不可关闭（仅 track 商家页可关）
    document.getElementById("gpsBtn").disabled = true;
    document.getElementById("gpsBtn").textContent = "GPS ဖွင့်ထားသည်";
    startGps();
    refreshRiderInfo();
    // 定期检查商家是否关闭 GPS（商家关闭后本端立即停止上报）
    if (state.refreshTimer) clearInterval(state.refreshTimer);
    state.refreshTimer = setInterval(refreshRiderInfo, 5000);
  } catch (e) {
    showInfo("ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။ ဝန်ဆောင်မှု စတင်ထားခြင်း ရှိမရှိ စစ်ဆေးပါ（请检查后端服务是否已启动，并用 http:// 地址访问）");
  }
}

// ---------- အခြေအနေ ပြောင်းခြင်း（需确认弹窗，确认后仅锁定该状态键） ----------
function requestStatus(status) {
  if ((state.confirmedStatuses || []).indexOf(status) >= 0) {
    showInfo("This status has already been confirmed and locked.");
    return;
  }
  state.pendingStatus = status;
  document.getElementById("stateConfirmText").textContent = "Change status to: " + status;
  document.getElementById("stateConfirmModal").style.display = "flex";
}
function closeStateConfirm() {
  document.getElementById("stateConfirmModal").style.display = "none";
}
async function doConfirmState() {
  document.getElementById("stateConfirmModal").style.display = "none";
  state.status = state.pendingStatus;
  state.statusLocked = true;
  if (!state.confirmedStatuses) state.confirmedStatuses = [];
  if (state.confirmedStatuses.indexOf(state.pendingStatus) < 0) state.confirmedStatuses.push(state.pendingStatus);
  document.getElementById("curStatus").textContent = state.status;
  disableStatusButton(state.pendingStatus);
  saveLockLocal();
  if (state.curLat !== null && state.curLat !== undefined) {
    reportLocation(state.curLat, state.curLng, state.status);
  }
}
// 仅禁用"已确认过"的状态键（其他状态键保持可点击，可继续推进状态）
function disableStatusButton(status) {
  document.querySelectorAll("#statusBox button").forEach(function(btn) {
    if (btn.getAttribute("data-status") === status) btn.disabled = true;
  });
}
function lockStatusButtons() {
  (state.confirmedStatuses || []).forEach(function(s) { disableStatusButton(s); });
  if ((state.confirmedStatuses || []).indexOf("လက်ခံပြီးပါပြီ") >= 0) {
    document.getElementById("confirmDeliveredBtn").disabled = true;
  }
}
function saveLockLocal() {
  try {
    var d = new Date();
    localStorage.setItem("riderLock_" + state.phone, JSON.stringify({
      order_no: state.orderNo, status: state.status, locked: state.statusLocked,
      date: d.toISOString(), name: state.name, confirmed: state.confirmedStatuses || []
    }));
  } catch (e) {}
}
function formatEnglishDate(input) {
  var d;
  if (input instanceof Date) { d = input; }
  else {
    var s = String(input || "");
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) { d = new Date(+m[1], +m[2] - 1, +m[3]); }
    else { d = new Date(s); }
  }
  if (isNaN(d.getTime())) return "-";
  return d.toLocaleDateString("en-GB", { year: "numeric", month: "long", day: "numeric" });
}

// ---------- တည်နေရာ တင်ခြင်း ----------
async function reportLocation(lat, lng, status, isSim) {
  if (!state.orderNo || !state.phone) return;
  status = status || state.status;
  isSim = isSim ? 1 : 0;
  try {
    var r = await fetch("/api/rider/location", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ order_no: state.orderNo, phone: state.phone, lat: lat, lng: lng, status: status, is_sim: isSim })
    });
    var j = await r.json();
    if (j.ok) {
      var now = new Date();
      document.getElementById("lastTime").textContent =
        now.getHours() + ":" + String(now.getMinutes()).padStart(2,"0") + ":" + String(now.getSeconds()).padStart(2,"0");
    } else {
      showInfo(j.msg);
    }
  } catch (e) {
    showInfo("ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။ ဝန်ဆောင်မှု စတင်ထားခြင်း ရှိမရှိ စစ်ဆေးပါ（请检查后端服务是否已启动）");
  }
}

// ---------- နည်းလမ်း ၁ - GPS တိုက်ရိုက်တင်ခြင်း ----------
function startGps() {
  if (!navigator.geolocation) { showInfo("သင့်ဘရောက်ဆာသည် တည်နေရာကို မထောက်ပံ့ပါ။ ဖုန်းဘရောက်ဆာ သို့မဟုတ် Chrome ဖြင့် ဖွင့်ပါ"); return; }
  document.getElementById("gpsBtn").disabled = true;
  document.getElementById("gpsBtn").textContent = "GPS ဖွင့်ပြီး အလိုအလျောက် တင်နေသည်...";
  stopSim();

  var gotFix = false;
  var timeoutId = null;

  function restoreBtn() {
    clearTimeout(timeoutId);
    // GPS 强制开启：快递员端不能自行关闭，仅 track 商家页可关
    document.getElementById("gpsBtn").disabled = true;
    document.getElementById("gpsBtn").textContent = "GPS ဖွင့်ထားသည်";
  }

  function gpsOk(pos) {
    gotFix = true;
    state.curLat = pos.coords.latitude;
    state.curLng = pos.coords.longitude;
    reportLocation(state.curLat, state.curLng, state.status);
  }

  function gpsFail() {
    if (gotFix) return;
    if (state.gpsWatchId !== null) { navigator.geolocation.clearWatch(state.gpsWatchId); state.gpsWatchId = null; }
    clearInterval(state.gpsTimer); state.gpsTimer = null;
    restoreBtn();
    showInfo("ဤစက်/ဘရောက်ဆာတွင် GPS ရယူ၍ မရပါ။ ဘရောက်ဆာ တည်နေရာခွင့်ပြုချက် ဖွင့်ပြီး ပြန်ကြိုးစားပါ（当前设备/浏览器无法获取GPS，请开启浏览器定位权限后重试）");
  }

  timeoutId = setTimeout(gpsFail, 15000); // 15 秒拿不到定位就自动恢复按钮

  state.gpsWatchId = navigator.geolocation.watchPosition(gpsOk, gpsFail, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });

  state.gpsTimer = setInterval(function() {
    if (gotFix) return;
    navigator.geolocation.getCurrentPosition(gpsOk, function() {}, { timeout: 8000 });
  }, 5000);
}

// ---------- နည်းလမ်း ၂ - သရုပ်ပြ ပို့ဆောင်ခြင်း（已移除，不再使用） ----------
function stopSim() {
  if (state.simTimer) { clearInterval(state.simTimer); state.simTimer = null; }
}

// ---------- ဆိုင်မှ လက်ခံရရှိကြောင်း အတည်ပြုခြင်း ----------
function confirmDelivered() {
  document.getElementById("confirmModal").style.display = "flex";
  document.getElementById("confirmBaozi").value = "";
  document.getElementById("confirmAddress").value = "";
}
function closeConfirmModal() {
  document.getElementById("confirmModal").style.display = "none";
}
async function doConfirmDelivered() {
  var baozi = parseInt(document.getElementById("confirmBaozi").value) || 0;
  var address = document.getElementById("confirmAddress").value.trim();
  if (baozi <= 0 && !address) { showInfo("အရေအတွက် သို့မဟုတ် လိပ်စာ ထည့်ပါ"); return; }
  try {
    var r = await fetch("/api/rider/confirm", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ order_no: state.orderNo, phone: state.phone, confirm_baozi: baozi, address: address })
    });
    var j = await r.json();
    if (!j.ok) { showInfo(j.msg); return; }
    closeConfirmModal();
    state.status = "လက်ခံပြီးပါပြီ";
    state.statusLocked = true;
    if (!state.confirmedStatuses) state.confirmedStatuses = [];
    if (state.confirmedStatuses.indexOf("လက်ခံပြီးပါပြီ") < 0) state.confirmedStatuses.push("လက်ခံပြီးပါပြီ");
    document.getElementById("curStatus").textContent = "လက်ခံပြီးပါပြီ";
    document.getElementById("curStatus").style.color = "#2e7d32";
    lockStatusButtons();
    saveLockLocal();
    showInfo("လက်ခံပြီးပါပြီ။ ဤအမှာစာ ပြီးဆုံးပါပြီ။ အမှာစာအသစ် ချိတ်ဆက်/ဖန်တီးနိုင်ပါပြီ");
    // 订单完成后重置本端状态，允许重新ချိတ်ဆက် 新订单
    resetAfterCompletion();
    refreshRiderInfo();
  } catch (e) {
    showInfo("ဆာဗာနှင့် ချိတ်ဆက်၍ မရပါ။ ဝန်ဆောင်မှု စတင်ထားခြင်း ရှိမရှိ စစ်ဆေးပါ");
  }
}

// ---------- အမှာစာ ပြီးဆုံးပြီးနောက် ပြန်လည် ချိတ်ဆက်နိုင်ရန် ပြန်လည်သတ်မှတ်ခြင်း ----------
function resetAfterCompletion() {
  var oldPhone = state.phone;
  // 停止当前订单的 GPS 上报与轮询
  if (state.gpsWatchId !== null) { try { navigator.geolocation.clearWatch(state.gpsWatchId); } catch (e) {} state.gpsWatchId = null; }
  if (state.gpsTimer) { clearInterval(state.gpsTimer); state.gpsTimer = null; }
  if (state.refreshTimer) { clearInterval(state.refreshTimer); state.refreshTimer = null; }
  if (state.simTimer) { clearInterval(state.simTimer); state.simTimer = null; }
  // 重置状态，允许重新绑定/创建新订单
  state.orderNo = ""; state.phone = ""; state.status = ""; state.statusLocked = false; state.pendingStatus = "";
  state.confirmedStatuses = []; state.curLat = null; state.curLng = null;
  // 恢复绑定表单
  document.getElementById("reportPanel").style.display = "none";
  document.getElementById("orderNo").value = "";
  document.getElementById("bindBtn").disabled = false;
  document.getElementById("bindBtn").textContent = "အမှာစာ ချိတ်ဆက်၍ ပို့ဆောင်စမည်";
  document.getElementById("curOrder").textContent = "";
  document.getElementById("curStatus").textContent = "-";
  document.getElementById("curStatus").style.color = "";
  document.getElementById("curLocation").textContent = "-";
  document.getElementById("curBaozi").textContent = "-";
  document.getElementById("curShop").textContent = "-";
  document.getElementById("lastTime").textContent = "-";
  // 恢复状态键与确认键可点击
  document.querySelectorAll("#statusBox button").forEach(function(btn) { btn.disabled = false; });
  document.getElementById("confirmDeliveredBtn").disabled = false;
  document.getElementById("gpsBtn").disabled = true;
  document.getElementById("gpsBtn").textContent = "GPS ဖွင့်ထားသည်";
  // 清除本地锁定记录，刷新后不残留旧订单锁定
  try { localStorage.removeItem("riderLock_" + oldPhone); } catch (e) {}
  // 自动带出扣减后的剩余数量，骑手无需重新输入
  if (oldPhone) { loadRemaining(oldPhone); }
}

// ---------- ကျန်ရှိသော အရေအတွက် အလိုအလျောက် ဖြည့်ခြင်း ----------
async function loadRemaining(phone) {
  if (!phone) return;
  try {
    var r = await fetch("/api/order/history?phone=" + encodeURIComponent(phone));
    var j = await r.json();
    if (!j.ok || !j.history || j.history.length === 0) return;
    var h = j.history[0];
    if (h.baozi_remaining !== undefined && h.baozi_remaining !== null && h.baozi_remaining !== "") {
      document.getElementById("baoziCount").value = h.baozi_remaining;
    }
    if (h.shop_remaining !== undefined && h.shop_remaining !== null && h.shop_remaining !== "") {
      document.getElementById("shopCount").value = h.shop_remaining;
    }
  } catch (e) {}
}

// ---------- နောက်ဆုံးအခြေအနေ ပြန်လည် ရယူခြင်း ----------
// 专业提示弹窗（替代原生 alert）
function showInfo(msg) {
  document.getElementById("infoText").textContent = msg;
  document.getElementById("infoModal").style.display = "flex";
}
function closeInfoModal() {
  document.getElementById("infoModal").style.display = "none";
}

// ---------- Order History（永久订单记录） ----------
var _historyAll = [];
var _historyDate = "";
var _historyVisible = 10;

async function openHistory() {
  var phone = document.getElementById("riderPhone").value.trim();
  if (!phone) { showInfo("ဖုန်းနံပါတ် ထည့်သွင်းပါ"); return; }
  document.getElementById("historyList").innerHTML = '<div class="history-empty">Loading...</div>';
  document.getElementById("historyMoreWrap").style.display = "none";
  document.getElementById("historyModal").style.display = "flex";
  try {
    var r = await fetch("/api/order/history?phone=" + encodeURIComponent(phone));
    var j = await r.json();
    if (!j.ok || !j.history || j.history.length === 0) {
      document.getElementById("historyList").innerHTML = '<div class="history-empty">No order history yet.</div>';
      return;
    }
    _historyAll = j.history;
    // 日期列表（去重、新→旧），来自 bind_time 前 10 位；跨 0 点不清零，永久保留
    var dates = [];
    _historyAll.forEach(function(h) {
      var d = (h.bind_time || "").slice(0, 10);
      if (d && dates.indexOf(d) < 0) dates.push(d);
    });
    dates.sort(function(a, b) { return a < b ? 1 : (a > b ? -1 : 0); });
    if (dates.length === 0) {
      var now = new Date();
      dates = [now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2)];
    }
    var sel = document.getElementById("historyDateFilter");
    sel.innerHTML = "";
    dates.forEach(function(d) {
      var opt = document.createElement("option");
      opt.value = d;
      opt.textContent = formatEnglishDate(d);
      sel.appendChild(opt);
    });
    _historyDate = dates[0];
    sel.value = _historyDate;
    _historyVisible = 10;
    renderHistory();
  } catch (e) {
    document.getElementById("historyList").innerHTML = '<div class="history-empty">Failed to load history.</div>';
  }
}

function renderHistory() {
  var sel = document.getElementById("historyDateFilter");
  if (sel.value) _historyDate = sel.value;
  var items = _historyAll.filter(function(h) {
    return (h.bind_time || "").slice(0, 10) === _historyDate;
  });
  var html = "";
  var show = items.slice(0, _historyVisible);
  show.forEach(function(h) {
    var dt = formatEnglishDate(h.bind_time);
    var loc = h.latest ? (h.latest.address || (h.latest.lat.toFixed(6) + ", " + h.latest.lng.toFixed(6))) : "-";
    var lastT = h.latest ? (h.latest.report_time || "-") : "-";
    html += '<div class="history-item">'
      + 'Date：<b>' + dt + '</b><br>'
      + 'ပို့ဆောင်သူအမည်：<b>' + (h.rider_name || "-") + '</b><br>'
      + 'ပို့ဆောင်သူ ဖုန်းနံပါတ်：<b>' + (h.rider_phone || "-") + '</b><br>'
      + 'လက်ရှိOrder Number：<b>' + h.order_no + '</b><br>'
      + 'လက်ရှိအခြေအနေ：<b>' + ((h.status && h.status !== "待取餐") ? h.status : "-") + '</b><br>'
      + 'လက်ရှိနေရာ：<b>' + loc + '</b><br>'
      + 'ပို့ရမည့်ဆိုင်လိပ်စာ：<b>' + (h.delivery_address || "-") + '</b><br>'
      + 'ကျန်ရှိသောပေါက်စီအလုံးအရေတွက်：<b>' + h.baozi_remaining + ' / ' + h.baozi_total + '</b><br>'
      + 'ကျန်ရှိသောဆိုင်အရေတွက်：<b>' + h.shop_remaining + ' / ' + h.shop_total + '</b><br>'
      + 'နောက်ဆုံး တင်ပြချိန်：<b>' + lastT + '</b>'
      + '</div>';
  });
  if (show.length === 0) html = '<div class="history-empty">No orders on this date.</div>';
  document.getElementById("historyList").innerHTML = html;
  var moreWrap = document.getElementById("historyMoreWrap");
  if (items.length > 10) {
    moreWrap.style.display = "block";
    document.getElementById("historyMoreBtn").textContent = (_historyVisible >= items.length) ? "View Less" : "View More (" + items.length + ")";
  } else {
    moreWrap.style.display = "none";
  }
}

function toggleHistoryMore() {
  var items = _historyAll.filter(function(h) {
    return (h.bind_time || "").slice(0, 10) === _historyDate;
  });
  if (_historyVisible >= items.length) { _historyVisible = 10; }
  else { _historyVisible = items.length; }
  renderHistory();
}

function closeHistory() {
  document.getElementById("historyModal").style.display = "none";
}

async function refreshRiderInfo() {
  if (!state.orderNo || !state.phone) return;
  try {
    var r = await fetch("/api/rider/info?order_no=" + encodeURIComponent(state.orderNo) + "&phone=" + encodeURIComponent(state.phone));
    var j = await r.json();
    if (!j.ok) return;
    // 状态同步：仅当快递员已确认锁定状态后才同步后端状态显示；
    // 未选择前保持 "-"，不显示配送中
    if (j.status && state.statusLocked) {
      state.status = j.status;
      document.getElementById("curStatus").textContent = j.status;
      document.querySelectorAll("#statusBox button").forEach(function(btn) {
        btn.classList.remove("active");
      });
      if (j.status === "လက်ခံပြီးပါပြီ") {
        document.getElementById("curStatus").style.color = "#2e7d32";
      } else {
        document.getElementById("curStatus").style.color = "";
      }
    }
    // 位置显示地名（反向地理编码），失败时回退经纬度
    document.getElementById("curLocation").textContent = j.latest ? (j.latest.address || (j.latest.lat.toFixed(6) + ", " + j.latest.lng.toFixed(6))) : "-";
    document.getElementById("curBaozi").textContent = (j.baozi_total - j.baozi_received) + " / " + j.baozi_total;
    document.getElementById("curShop").textContent = (j.shop_total - j.shop_received) + " / " + j.shop_total;
    // 商家关闭 GPS 后：立即停止本端上报（GPS 停止），且不能自行重新开启
    if (j.gps_enabled === 0 && state.gpsEnabled) {
      state.gpsEnabled = false;
      if (state.gpsWatchId !== null) { navigator.geolocation.clearWatch(state.gpsWatchId); state.gpsWatchId = null; }
      clearInterval(state.gpsTimer); state.gpsTimer = null;
      stopSim();
      document.getElementById("gpsBtn").disabled = true;
      document.getElementById("gpsBtn").textContent = "GPS ပိတ်ထားသည်";
      showInfo("ဆိုင်က GPS ခြေရာခံခြင်းကို ပိတ်ထားပါသည်။ ဤဘက်မှ တည်နေရာ တင်ခြင်း ရပ်တန့်ပြီးပါပြီ");
    }
  } catch (e) {}
}

// ---------- 页面加载：恢复已锁定状态（刷新后仍不可修改） ----------
(function() {
  var phone = document.getElementById("riderPhone").value.trim();
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("riderLock_" + phone)); } catch (e) {}
  if (saved && saved.locked && saved.order_no) {
    state.orderNo = saved.order_no;
    state.phone = phone;
    state.name = saved.name || "";
    state.status = saved.status || "";
    state.statusLocked = true;
    state.confirmedStatuses = saved.confirmed || (saved.status ? [saved.status] : []);
    document.getElementById("reportPanel").style.display = "block";
    document.getElementById("curOrder").textContent = saved.order_no;
    document.getElementById("curDate").textContent = formatEnglishDate(saved.date || new Date().toISOString());
    document.getElementById("curStatus").textContent = saved.status || "-";
    document.getElementById("orderNo").value = saved.order_no;
    document.getElementById("bindBtn").disabled = true;
    document.getElementById("bindBtn").textContent = "ချိတ်ဆက်ပြီးပါပြီ";
    lockStatusButtons();
    startGps();
    refreshRiderInfo();
    if (state.refreshTimer) clearInterval(state.refreshTimer);
    state.refreshTimer = setInterval(refreshRiderInfo, 5000);
  }
})();
</script>
