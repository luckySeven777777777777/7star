<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      --text: #f3f5fb;
      --muted: #aeb5c8;
      --line: rgba(220, 229, 247, .48);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 53% 48%, rgba(111, 120, 255, .44) 0, rgba(48, 67, 151, .18) 24%, transparent 48%),
        radial-gradient(ellipse at 52% 74%, rgba(22, 221, 247, .16), transparent 28%),
        #080b18;
      position: relative;
      isolation: isolate;
    }
    /* Soft neon ribbons around the perimeter, inspired by the reference image. */
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: -18%;
      pointer-events: none;
      background:
        linear-gradient(72deg, transparent 16%, rgba(88, 235, 255, .95) 17%, rgba(67, 97, 255, .9) 18%, transparent 19%) 0 0 / 100% 100%,
        linear-gradient(112deg, transparent 11%, rgba(255, 73, 202, .9) 12%, rgba(255, 198, 128, .8) 12.5%, transparent 13.5%) 0 0 / 100% 100%,
        linear-gradient(16deg, transparent 20%, rgba(28, 201, 255, .9) 21%, rgba(140, 73, 255, .86) 22%, transparent 23%) 0 0 / 100% 100%,
        linear-gradient(194deg, transparent 24%, rgba(48, 115, 255, .9) 25%, rgba(55, 227, 255, .85) 26%, transparent 27%) 0 0 / 100% 100%;
      filter: blur(10px);
      opacity: .82;
      mask-image: radial-gradient(ellipse at center, transparent 0 35%, #000 60%);
    }
    .login-card {
      width: min(448px, 100%);
      min-height: 630px;
      padding: 78px 46px 58px;
      border: 1px solid rgba(220, 229, 247, .31);
      border-radius: 27px;
      background:
        radial-gradient(ellipse at 57% 48%, rgba(89, 99, 189, .27), transparent 55%),
        linear-gradient(135deg, rgba(40, 34, 55, .91), rgba(12, 20, 43, .94) 58%, rgba(17, 27, 47, .94));
      box-shadow: 0 18px 70px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 11vw, 58px);
      line-height: 1.02;
      letter-spacing: -2.8px;
      font-weight: 700;
    }
    .subtitle { margin: 7px 0 62px; font-size: 16px; }
    .field {
      height: 55px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 15px;
      background: rgba(255,255,255,.018);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.015);
      transition: border-color .2s, box-shadow .2s;
    }
    .field:focus-within { border-color: rgba(133, 220, 255, .95); box-shadow: 0 0 0 3px rgba(76, 177, 255, .12); }
    .field input {
      min-width: 0;
      flex: 1;
      height: 100%;
      padding: 0 0 0 26px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      background: transparent;
      border: 0;
      outline: 0;
    }
    .field input::placeholder { color: #9299ad; opacity: .82; }
    .icon-button {
      width: 52px;
      height: 100%;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #e8edf7;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .icon-button svg { width: 30px; height: 30px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .remember {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 0;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
    }
    .remember input { width: 15px; height: 15px; margin: 0; accent-color: #8fdcfb; }
    .login-button {
      width: 100%;
      height: 55px;
      margin-top: 69px;
      color: var(--text);
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      cursor: pointer;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .login-button:hover { background: rgba(102, 167, 255, .16); border-color: rgba(220, 238, 255, .78); }
    .login-button:active { transform: scale(.99); }
    .forgot { margin: 17px 0 0; font-size: 15px; }
    .form-msg {
      margin: 18px 0 0;
      font-size: 14px;
      line-height: 1.5;
      color: #ff9d9d;
      display: none;
      word-break: break-word;
    }
    .form-msg.show { display: block; }
    .form-msg.ok { color: #8fdcfb; }
    a { color: #e9edf6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .login-card { min-height: auto; padding: 58px 28px 48px; border-radius: 23px; }
      .subtitle { margin-bottom: 48px; }
      .login-button { margin-top: 55px; }
    }
  </style>
</head>
<body>
  <main class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Login</h1>
    <p class="subtitle">Welcome back</p>

    <form id="login-form" autocomplete="off">
      <label class="field" aria-label="User Name">
        <input id="username" name="username" type="text" placeholder="User Name" autocomplete="off" required />
        <span class="icon-button" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="16" cy="10" r="6.5"/><path d="M3.5 28c1.7-6.5 6.2-10 12.5-10s10.8 3.5 12.5 10"/></svg>
        </span>
      </label>

      <label class="field" aria-label="Password">
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" required />
        <button class="icon-button" id="toggle-password" type="button" aria-label="Show password">
          <svg viewBox="0 0 32 32"><path d="M3 16s4.5-9 13-9c3.1 0 5.7 1.1 7.8 2.7M29 16s-4.5 9-13 9c-3.1 0-5.7-1.1-7.8-2.7"/><path d="M12.3 12.3a5.2 5.2 0 0 0 7.4 7.4M4 4l24 24"/></svg>
        </button>
      </label>

      <label class="remember"><input type="checkbox" name="remember" /> <span>Remember me</span></label>
      <button class="login-button" type="submit">Login</button>
      <p class="form-msg" id="formMsg"></p>
      <p class="forgot"><a href="#" id="forgotLink">Forgot the password?</a></p>
    </form>
  </main>

  <script>
    const passwordInput = document.getElementById('password');
    const usernameInput = document.getElementById('username');
    const rememberCheck = document.querySelector('input[name="remember"]');
    const toggleButton = document.getElementById('toggle-password');
    toggleButton.addEventListener('click', () => {
      const showing = passwordInput.type === 'password';
      passwordInput.type = showing ? 'text' : 'password';
      toggleButton.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
    });

    // 登录页默认保持空白：阻止浏览器/密码管理器自动填充账号密码
    usernameInput.setAttribute('readonly', '');
    passwordInput.setAttribute('readonly', '');
    setTimeout(() => {
      usernameInput.removeAttribute('readonly');
      passwordInput.removeAttribute('readonly');
    }, 500);

    // 仅当用户上次勾选 Remember me 时才回填账号密码，否则保持空白
    try {
      if (localStorage.getItem('marvis_remember') === '1') {
        usernameInput.value = localStorage.getItem('marvis_remember_user') || '';
        passwordInput.value = localStorage.getItem('marvis_remember_pass') || '';
        if (usernameInput.value) rememberCheck.checked = true;
      }
    } catch (e) {}

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const msgEl = document.getElementById('formMsg');
      msgEl.classList.remove('show', 'ok');
      const form = event.target;
      const next = new URLSearchParams(location.search).get('next');
      // 目标页面角色隔离：/rider 只允许骑手账号登录，/track 只允许管理员账号登录
      const page = (!next || next.indexOf('/rider') >= 0) ? 'rider' : 'track';
      const payload = {
        username: form.username.value.trim(),
        password: form.password.value,
        page: page
      };
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          msgEl.textContent = data.msg || 'Login failed.';
          msgEl.classList.add('show');
          return;
        }
        localStorage.setItem('userToken', data.token);
        // 骑手页(rider)与商家页(track)登录态隔离：骑手页存 riderToken，商家/管理页存 userToken
        if (next && next.indexOf('/rider') >= 0) {
          localStorage.setItem('riderToken', data.token);
          localStorage.removeItem('userToken');
        } else {
          localStorage.setItem('userToken', data.token);
          localStorage.removeItem('riderToken');
        }
        // Remember me：仅勾选时才本地保存账号密码用于下次回填；未勾选保持登录页空白
        try {
          if (form.remember && form.remember.checked) {
            localStorage.setItem('marvis_remember', '1');
            localStorage.setItem('marvis_remember_user', form.username.value.trim());
            localStorage.setItem('marvis_remember_pass', form.password.value);
          } else {
            localStorage.setItem('marvis_remember', '0');
            localStorage.removeItem('marvis_remember_user');
            localStorage.removeItem('marvis_remember_pass');
          }
        } catch (e) {}
        location.href = (next && next.startsWith('/')) ? next : '/rider';
      } catch (e) {
        msgEl.textContent = 'Cannot connect to server. Please try again.';
        msgEl.classList.add('show');
      }
    });

    document.getElementById('forgotLink').addEventListener('click', (event) => {
      event.preventDefault();
      const msgEl = document.getElementById('formMsg');
      msgEl.classList.remove('ok');
      msgEl.textContent = 'Please contact your administrator to reset your password.';
      msgEl.classList.add('show');
    });
  </script>
</body>
</html>
